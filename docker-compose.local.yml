services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: unless-stopped
    env_file: .env.local
    environment:
      VITE_LOCAL_DEVELOPMENT: "true"
      VITE_SERVER_HOST: 0.0.0.0
      VITE_API_BASE_URL: /api/
      VITE_LEGACY_API_BASE_URL: /legacy
      VITE_LEGACY_WS_BASE_URL: ws://localhost:5173/legacy
      VITE_LEGACY_API_TARGET: http://legacy-api:8000
      VITE_V2_API_TARGET: http://v2-api:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - local_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [al_lms_local]

volumes:
  local_node_modules:

networks:
  al_lms_local:
    external: true
    name: al-lms-local
